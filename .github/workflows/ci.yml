name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      # Building the solution compiles the CLI for all its target frameworks
      # (net8.0;net9.0;net10.0); the test projects target net9.0 only.
      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release --verbosity normal

      - name: AOT Publish
        run: dotnet publish src/Skills.Cli/Skills.Cli.csproj -c Release -f net10.0 -r ${{ matrix.rid }} --self-contained

      # Proves the library is AOT-compatible as a package contract, not just as the shipping
      # skills binary above: the sample embedding host (samples/EmbeddedHost), which only
      # references Skills.csproj, must also publish AOT warning-free.
      - name: AOT Publish (embedded host sample)
        run: dotnet publish samples/EmbeddedHost/EmbeddedHost.csproj -c Release -f net10.0 -r ${{ matrix.rid }} --self-contained

      # Publish-time analysis can miss AOT runtime metadata failures (e.g. trimmed reflection
      # paths that only throw when actually invoked), so run the published binary here too.
      - name: Run AOT consumer binary
        shell: bash
        run: |
          bin="samples/EmbeddedHost/bin/Release/net10.0/${{ matrix.rid }}/publish/embeddedhost"
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            bin="${bin}.exe"
          fi
          "$bin" skills list
